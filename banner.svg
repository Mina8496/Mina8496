<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mina Kamil, Flutter Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#0A4FA8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8FA8FF"/>
    </linearGradient>
    <clipPath id="screen"><rect x="944" y="52" width="142" height="216" rx="16"/></clipPath>
    <style>
      .f { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .float1 { animation: floaty 7s ease-in-out infinite; }
      .float2 { animation: floaty 9s ease-in-out infinite reverse; }
      .float3 { animation: floaty 8s ease-in-out infinite; animation-delay: -3s; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
      .scan   { animation: scan 3.6s ease-in-out infinite; }
      .bar1   { animation: grow 3.2s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
      .bar2   { animation: grow 3.2s ease-in-out infinite; animation-delay: .5s; transform-origin: left center; transform-box: fill-box; }
      .bar3   { animation: grow 3.2s ease-in-out infinite; animation-delay: 1s; transform-origin: left center; transform-box: fill-box; }
      @keyframes floaty { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
      @keyframes pulse  { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @keyframes scan   { 0% { transform: translateY(0) } 50% { transform: translateY(150px) } 100% { transform: translateY(0) } }
      @keyframes grow   { 0%,100% { transform: scaleX(.35) } 50% { transform: scaleX(1) } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>

  <!-- soft floating shapes -->
  <circle class="float1" cx="120" cy="40" r="90" fill="#38BDF8" opacity=".10"/>
  <circle class="float2" cx="720" cy="300" r="120" fill="#8FA8FF" opacity=".10"/>
  <circle class="float3" cx="640" cy="60" r="38" fill="#38BDF8" opacity=".14"/>

  <!-- text -->
  <text class="f" x="64" y="88" font-size="22" fill="#B9D4F6" font-weight="500">Hi, I'm</text>
  <text class="f" x="62" y="154" font-size="68" fill="#FFFFFF" font-weight="800" letter-spacing="-1">Mina Kamil</text>
  <text class="f" x="64" y="200" font-size="32" font-weight="700" fill="url(#accent)">Flutter Developer</text>
  <text class="f" x="64" y="238" font-size="19" fill="#CFE0F7">Clean Architecture  ·  Bloc / Cubit  ·  Firebase  ·  REST APIs</text>

  <!-- status pill -->
  <rect x="64" y="262" width="296" height="34" rx="17" fill="#FFFFFF" opacity=".10"/>
  <circle class="pulse" cx="86" cy="279" r="6" fill="#34D399"/>
  <text class="f" x="102" y="285" font-size="15" fill="#E6F0FF" font-weight="600">Available for freelance projects</text>

  <!-- phone mock -->
  <g>
    <rect x="928" y="36" width="174" height="248" rx="28" fill="#0A1426" stroke="#38BDF8" stroke-opacity=".7" stroke-width="2"/>
    <rect x="944" y="52" width="142" height="216" rx="16" fill="#112A4D"/>
    <g clip-path="url(#screen)">
      <rect x="944" y="52" width="142" height="30" fill="#0468D7"/>
      <rect x="954" y="62" width="48" height="10" rx="5" fill="#FFFFFF" opacity=".9"/>
      <rect x="954" y="94" width="122" height="46" rx="10" fill="#1B4378"/>
      <rect class="bar1" x="962" y="104" width="86" height="8" rx="4" fill="#38BDF8"/>
      <rect class="bar2" x="962" y="120" width="60" height="8" rx="4" fill="#8FA8FF"/>
      <rect x="954" y="150" width="122" height="46" rx="10" fill="#1B4378"/>
      <rect class="bar2" x="962" y="160" width="92" height="8" rx="4" fill="#38BDF8"/>
      <rect class="bar3" x="962" y="176" width="54" height="8" rx="4" fill="#8FA8FF"/>
      <rect x="954" y="206" width="122" height="46" rx="10" fill="#1B4378"/>
      <rect class="bar3" x="962" y="216" width="78" height="8" rx="4" fill="#38BDF8"/>
      <rect class="bar1" x="962" y="232" width="100" height="8" rx="4" fill="#8FA8FF"/>
      <rect class="scan" x="944" y="82" width="142" height="3" fill="#38BDF8" opacity=".55"/>
    </g>
    <rect x="990" y="42" width="50" height="6" rx="3" fill="#0A1426"/>
  </g>

  <!-- floating chips -->
  <g class="float2">
    <rect x="800" y="70" width="104" height="32" rx="16" fill="#FFFFFF" opacity=".12"/>
    <text class="f" x="852" y="91" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bloc / Cubit</text>
  </g>
  <g class="float1">
    <rect x="812" y="140" width="92" height="32" rx="16" fill="#FFFFFF" opacity=".12"/>
    <text class="f" x="858" y="161" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Firebase</text>
  </g>
  <g class="float3">
    <rect x="788" y="210" width="116" height="32" rx="16" fill="#FFFFFF" opacity=".12"/>
    <text class="f" x="846" y="231" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Google Play</text>
  </g>
</svg>
